name: Browser acceptance
on:
  push:
    branches: [improve/ss1-nerdc-alignment]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    # Pin to a Playwright-supported image; ubuntu-latest moved to 26.04,
    # which Playwright 1.56.1 does not support for browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
